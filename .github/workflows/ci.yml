name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: backend-php-${{ matrix.php }}
    runs-on: ubuntu-latest
    env:
      LOG_NAME: backend-php-${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3, curl, zip, xml, bcmath, fileinfo, intl
          coverage: none
      - name: Install dependencies
        working-directory: backend
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress 2>&1 | tee -a /tmp/ci.log
          php artisan key:generate 2>&1 | tee -a /tmp/ci.log
      - name: Run tests (SQLite)
        working-directory: backend
        run: php artisan test 2>&1 | tee -a /tmp/ci.log
      - name: Publish log tail as a check run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.existsSync('/tmp/ci.log') ? fs.readFileSync('/tmp/ci.log', 'utf8').slice(-60000) : '(no log)';
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
              name: 'log-' + process.env.LOG_NAME, status: 'completed', conclusion: 'neutral',
              output: { title: 'log tail', summary: 'tail of captured output', text: '```\n' + text + '\n```' }
            });

  backend-mariadb:
    name: backend-mariadb
    runs-on: ubuntu-latest
    env:
      LOG_NAME: backend-mariadb
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: lims
      DB_USERNAME: root
      DB_PASSWORD: root
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: lims
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, curl, zip, xml, bcmath, fileinfo, intl
          coverage: none
      - name: Install dependencies
        working-directory: backend
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress 2>&1 | tee -a /tmp/ci.log
          php artisan key:generate 2>&1 | tee -a /tmp/ci.log
      - name: Fresh migrate + seed on MariaDB
        working-directory: backend
        run: php artisan migrate:fresh --seed --force 2>&1 | tee -a /tmp/ci.log
      - name: Seed again (must be idempotent)
        working-directory: backend
        run: php artisan db:seed --force 2>&1 | tee -a /tmp/ci.log
      - name: Full test suite on MariaDB
        working-directory: backend
        run: php artisan test 2>&1 | tee -a /tmp/ci.log
      - name: Publish log tail as a check run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.existsSync('/tmp/ci.log') ? fs.readFileSync('/tmp/ci.log', 'utf8').slice(-60000) : '(no log)';
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
              name: 'log-' + process.env.LOG_NAME, status: 'completed', conclusion: 'neutral',
              output: { title: 'log tail', summary: 'tail of captured output', text: '```\n' + text + '\n```' }
            });

  catalog-import:
    name: catalog-import
    runs-on: ubuntu-latest
    env:
      LOG_NAME: catalog-import
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Imported catalog must match the committed workbook
        run: |
          pip install openpyxl 2>&1 | tee -a /tmp/ci.log
          python tools/import_workbook_catalog.py --check 2>&1 | tee -a /tmp/ci.log
      - name: Publish log tail as a check run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.existsSync('/tmp/ci.log') ? fs.readFileSync('/tmp/ci.log', 'utf8').slice(-60000) : '(no log)';
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
              name: 'log-' + process.env.LOG_NAME, status: 'completed', conclusion: 'neutral',
              output: { title: 'log tail', summary: 'tail of captured output', text: '```\n' + text + '\n```' }
            });

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    env:
      LOG_NAME: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, typecheck, test, build
        working-directory: frontend
        run: |
          npm ci 2>&1 | tee -a /tmp/ci.log
          npm run typecheck 2>&1 | tee -a /tmp/ci.log
          npm test 2>&1 | tee -a /tmp/ci.log
          npm run build 2>&1 | tee -a /tmp/ci.log
      - name: Publish log tail as a check run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.existsSync('/tmp/ci.log') ? fs.readFileSync('/tmp/ci.log', 'utf8').slice(-60000) : '(no log)';
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
              name: 'log-' + process.env.LOG_NAME, status: 'completed', conclusion: 'neutral',
              output: { title: 'log tail', summary: 'tail of captured output', text: '```\n' + text + '\n```' }
            });
